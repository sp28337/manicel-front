name: CI/CD Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Audit dependencies
        run: pnpm audit --prod

      - name: Build Next.js
        run: pnpm run build

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: manicel

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GIT_TOKEN
          script: |
            set -euo pipefail

            echo "🚀 Starting frontend deployment..."

            cd ~/manicel/manicel-front || { echo "❌ Failed to change directory"; exit 1; }

            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Use LTS Node
            nvm use 24
            node -v
            corepack enable
            pnpm -v

            echo "📦 Pulling latest code..."
            git fetch "https://${GIT_TOKEN}@github.com/sp28337/manicel-front.git" main
            git checkout main
            git merge --ff-only FETCH_HEAD

            echo "📥 Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "🏗️ Building frontend..."
            pnpm run build

            echo "🔄 Restarting service..."
            sudo systemctl daemon-reload
            sudo systemctl restart manicel-front.service

            echo "⏳ Waiting for service..."
            sleep 3

            if ! sudo systemctl is-active --quiet manicel-front.service; then
              echo "❌ manicel-front.service failed!"
              sudo journalctl -u manicel-front.service -n 50 --no-pager
              exit 1
            fi

            echo "🏥 Health check..."
            if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "⚠️ manicel-front.service not responding yet (may still be warming up)"
            fi

            echo "✅ Frontend deployment successful!"
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
